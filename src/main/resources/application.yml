server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: shipment-profit-calculator-api

  datasource:
    url: jdbc:h2:mem:shipmentprofitdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  level:
    com.shipmentprofit.api: DEBUG

app:
  cors:
    allowed-origins: http://localhost:4200
